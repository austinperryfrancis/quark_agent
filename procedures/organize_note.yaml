procedure: obsidian.organize_note

steps:
  - id: read_note
    op: obsidian.read_note
  - id: parse_frontmatter
    op: obsidian.parse_frontmatter
    depends_on: [read_note]
  - id: generate_tags
    op: obsidian.generate_tags
    depends_on: [read_note, parse_frontmatter]
  - id: find_related_notes
    op: obsidian.find_related_notes
    depends_on: [read_note]
  - id: generate_frontmatter
    op: obsidian.generate_frontmatter
    depends_on: [read_note, parse_frontmatter, generate_tags]
  - id: validate_note
    op: obsidian.validate_note
    depends_on: [generate_tags, find_related_notes, generate_frontmatter]
  - id: apply_changes
    op: obsidian.apply_changes
    depends_on: [validate_note]

