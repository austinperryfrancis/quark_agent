[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-agent"
version = "0.1.0"
description = "Harness-first local agent framework for small language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
quark = "quark.cli:app"

[tool.setuptools.packages.find]
include = ["quark*", "skills*"]

[tool.setuptools.package-data]
"skills.obsidian" = ["manifest.yaml", "prompts/*.txt", "schemas/*.json"]
"skills.core_text" = ["manifest.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "skills"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quark"]
