runtime:
  database: quark.db
  dry_run: true
  log_format: console
  log_level: INFO

model:
  provider: ollama
  name: qwen2.5:1.5b
  endpoint: http://127.0.0.1:11434
  temperature: 0.1
  max_tokens: 256
  timeout_seconds: 60

vault:
  path: null
  inbox: Inbox
  exclude: [.obsidian, .quark, Templates, Archive, backups]
  create_backups: true
  backup_retention: 5

permissions:
  allow_read: true
  allow_write: false
  require_destructive_approval: true
  require_external_approval: true

frontmatter:
  field_order: [title, type, project, created, updated, tags, status, action_required, people]
  preserve_unknown_fields: true
  max_tags: 8

retries:
  max_attempts: 3
  initial_delay_seconds: 0.25
  backoff_multiplier: 2
